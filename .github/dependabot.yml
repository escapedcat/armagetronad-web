# Keep the actions this repo uses on their current major, and the relay's npm
# dependencies current.
#
# WHY. GitHub Actions has no floating "latest" for an action: `@v6` follows
# patches within a major, and a new major is a new tag nobody pulls in on its
# own. The maintainer asked for "always latest"; this is the mechanism that
# exists for it. When actions/checkout, actions/cache or actions/setup-node cut
# a new major, Dependabot opens one PR with the bump, and that PR runs the
# client build like any other before it can merge.
#
# WHAT PROMPTED IT. The runner began printing "Node 20 is being deprecated" on
# every run: the @v4 majors declare `using: node20` in their action.yml and the
# runner now executes them on Node 24. @v6 declares node24 (checked against the
# action.yml of each tag on 2026-09-03). That notice is about the ACTIONS'
# runtime, not about the Node 22 our steps run on.
#
# NOTE ON FILE PLACEMENT. Same exception as the workflows: this file has to live
# under .github/, outside the repo's src/emscripten/, web/, deps/, docs/ rule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # THE RELAY (bridge/). Since M-C it is open to every visitor of the published
  # page, so its one runtime dependency, ws, faces the internet. Weekly, so a
  # fix lands as one small PR instead of a pile; checks.yml's bridge-tests job
  # runs the relay's suite on that PR, and deploy-relay.yml ships it on merge.
  # web/'s npm packages are build/deploy tools that never reach a visitor, so
  # they are left to Dependabot security updates (on for the repository).
  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
