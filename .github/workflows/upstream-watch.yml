# Watch upstream Armagetron for commits that would cost this port something.
#
# WHY THIS EXISTS NOW. PLAN.md froze upstream tracking until the Demo shipped:
# mid-port merges would have landed rebase noise on exactly the files being
# patched. The Demo has shipped, so tracking resumes -- and the stated reason
# for tracking at all is that the port "could one day be offered upstream as a
# merge request", which only stays true if the drift is known.
#
# WHY A PULL REQUEST, NOT AN ISSUE. Until 2026-11 this job kept one issue
# (#92) and commented on it weekly. Nobody saw it: the owner does not watch the
# repo, and a bot's issue notifies no one else. The same reports also left out
# upstream's netobject owner check because it was in a file the port never
# patched. Now the job opens one PR that merges upstream into main, asks the
# owner for review (a review request always notifies), and lists security-
# relevant commits first wherever they land. web/tools/upstream-pr.sh has the
# details, including why it needs two tokens.
#
# NOTE ON FILE PLACEMENT. This repo's convention is that new files live under
# src/emscripten/, web/, deps/ or docs/. A GitHub Actions workflow has to live
# in .github/workflows/ and cannot honour that; the logic it calls does live in
# web/tools/ and runs locally with no arguments, so the exception is the
# scheduler, not the substance.

name: upstream-watch

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Not daily: legacy_0.2.9 is a maintenance
    # branch, and a job that cries wolf weekly gets muted, which is worse than
    # no job. Manual dispatch is there for when someone actually wants to know.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write        # push the upstream-merge branch
  pull-requests: write   # open, edit and comment on its PR

# One run at a time: two would race for the same branch and PR.
concurrency:
  group: upstream-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base against upstream needs real history, not a shallow clone.
          fetch-depth: 0
          # Pushes name their token explicitly (upstream-pr.sh); a stored
          # credential header would override that and push as the workflow.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Open or refresh the upstream-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          REVIEWER: ${{ github.repository_owner }}
          OUT: ${{ runner.temp }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::secret UPSTREAM_PR_TOKEN is missing or expired; see web/tools/upstream-pr.sh"
            exit 1
          fi
          bash web/tools/upstream-pr.sh
