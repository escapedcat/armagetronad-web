<!doctype html>
<!--
  Shell page for the wasm client (web/Makefile's --shell-file).

  This file IS the whole page Emscripten emits as armagetronad.html -- it is
  not a fragment dropped into some other template. The build tool does a
  literal string substitution of the triple-brace SCRIPT placeholder near the
  end of <body> with a <script> tag that loads the generated armagetronad.js
  loader, which in turn fetches the .wasm and the preloaded .data archive.
  That placeholder is mandatory -- em++ hard-fails the link step if it is
  missing -- and because the substitution is a plain text replace of every
  occurrence, do not paste its literal three-brace form anywhere in this file
  except at that one spot (this comment deliberately does not spell it out,
  having once been mangled by its own explanation).

  Load order matters: the placeholder must come AFTER the <script> below that
  defines `Module`, because armagetronad.js looks for a pre-existing global
  `Module` object as it starts up and merges its own runtime hooks into it.
  Defining Module later would just be ignored.

  This must be served over HTTP, not opened as a file:// URL: the loader
  fetches the .wasm and .data files with fetch()/XHR, which file:// pages
  are not allowed to do in most browsers. The failure handling below exists
  mainly to surface that specific mistake, since it is the single most
  likely first thing anyone opening this page hits.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- PHASE 3. WITHOUT THIS LINE THE PAGE IS NOT A MOBILE PAGE AT ALL, and
       nothing else in this file can compensate. A page with no viewport meta is
       laid out by Android Chrome against a ~980 CSS-px virtual viewport and
       then scaled down to fit the screen -- so window.innerWidth reports ~980,
       the sizing block below computes a backing store for a window that does
       not exist, and the whole page renders zoomed out. Every desktop browser
       ignores this element entirely, so it cannot affect the shipped Demo.

       user-scalable=no is deliberate and is not the usual accessibility
       mistake: this page is a single fixed-aspect canvas that fills the
       viewport with no text to enlarge and nothing to pan to, and the touch
       overlay below turns taps into game input, so a pinch-zoom leaves the
       player looking at a corner of a game they can no longer aim at. iOS
       Safari ignores it anyway. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Armagetron Advanced</title>
  <style>
    html, body { height:100%; }
    /* The touch overlay's elements carry the `hidden` attribute when they are
       off. The UA rule for [hidden] is display:none at the lowest specificity,
       which every `display:` below would beat -- so it is restated here with
       !important. Without it, `hidden` is decorative and a desktop visitor gets
       the phone controls. */
    [hidden] { display:none !important; }
    /* Centred with flexbox, and the page never scrolls. The canvas is sized to
       the viewport, so a stray scrollbar would shrink the viewport, which would
       have made the very number the sizing block reads depend on the layout it
       produces. */
    body { margin:0; height:100%; overflow:hidden; background:#111; color:#eee;
           display:flex; align-items:center; justify-content:center;
           font:14px/1.4 system-ui, sans-serif;
           /* PHONE FEEDBACK, THE SECOND DECLARATION. `height:100%` resolves
              against the initial containing block, and on a phone browser that
              box is not guaranteed to be the part of the screen you can see.
              The canvas is CENTRED in this box, so a box taller than the
              visible area pushes the picture down and takes the bottom of it
              -- which is where this game draws the entire HUD: scores, speed,
              rubber, brakes -- under the fold, with the `overflow:hidden` on
              this same element making it unreachable.

              100dvh is by definition the height that is visible right now, so
              the centring happens inside what the player can actually see. It
              is a SECOND declaration for the same reason the two widths on
              #canvas are (a browser without dvh drops the whole declaration,
              not just the unit), and it is inert on every desktop, where the
              two numbers are equal.

              NOT MEASURED ON A DEVICE, and must not be quoted as if it were:
              Chrome's device emulation reports vh == dvh == svh == lvh ==
              innerHeight in every configuration this repo can drive (the table
              in docs/evidence/phone-feedback/README.md), so the situation this
              defends against cannot be reproduced here. Correct by
              construction, not by experiment. */
           height:100dvh; }
    /* THE GAME FILLS THE WINDOW. Before M5 this was `margin:0 auto` on a fixed
       1024x768 canvas, which on any large display drew the game as a small
       rectangle in a sea of black.

       DISPLAY SIZE AND BACKING-STORE SIZE ARE INDEPENDENT AND ONLY ONE COSTS
       FRAME RATE. This rule is pure CSS: it decides how many screen pixels the
       finished frame is stretched over, which the compositor does for free. The
       number of pixels the GAME renders is canvas.width/height, set from the
       viewport by the script below, and that is the one that costs anything.
       Capping the backing store would not and must not disable this rule.

       AT LOAD THIS IS EXACTLY 1:1 AND SCALES NOTHING. The backing store is the
       viewport, so min() picks 100vw and height comes out at 100vh. The formula
       only starts doing work once the window is resized afterwards -- see the
       resize paragraph in the sizing block below for why that is the intended
       behaviour rather than a bug.

       WHY min()/calc() AND NOT max-width/max-height, AND NOT object-fit. Three
       obvious spellings are wrong, and this was measured in Chrome rather than
       reasoned (docs/evidence/m5-startup/README.md has the table):

         max-width:100%; max-height:100%   only ever SHRINKS. Enlarge the window
                                           or press F11 and the game stays the
                                           size it loaded at.
         width:100%; height:auto; max-*    STRETCHES. CSS's replaced-element
                                           constraint table does not adjust a
                                           width that was specified, so a window
                                           wider than the canvas produced a
                                           2000x500 box at ratio 4.00.
         width/height:100%; object-fit     looks right and breaks the mouse: the
                                           element box becomes the whole window
                                           while the image is inset, and
                                           Browser.calculateMouseCoords scales a
                                           pointer event by canvas.width divided
                                           by getBoundingClientRect().width.

       min(100vw, 100vh * aspect) with height:auto is a contain-fit that grows
       AND shrinks AND keeps the element's border box exactly equal to the drawn
       image, so the mouse mapping stays exact at every window size.

       --aa-aspect is set on <html> by the script below. It lives there rather
       than on the canvas because Browser.updateCanvasDimensions() calls
       canvas.style.removeProperty('width'/'height') on every SDL_SetVideoMode,
       and that cannot reach a custom property on another element. The 1.3333
       fallback is the ratio of the 1024x768 attributes on the element itself,
       i.e. what a browser that never ran the sizing block gets. */
    #canvas { display:block; flex:0 0 auto; background:#000;
              width: min(100vw, calc(100vh * var(--aa-aspect, 1.3333)));
              /* PHASE 3: THE SECOND DECLARATION IS FOR PHONES AND IS INERT ON A
                 DESKTOP, where dvh and vh are the same number. On a phone they
                 are not: 100vh is the LARGE viewport (the one you get with the
                 URL bar scrolled away) while the sizing block below reads
                 window.innerHeight, which is the SMALL viewport (URL bar
                 showing). Left as vh alone, the contain-fit above is solved
                 against a taller box than exists and the canvas is cropped top
                 and bottom by body's overflow:hidden.

                 It is written as a SECOND width rather than as an edit to the
                 first because a browser without dvh drops the whole
                 declaration, not just the unit -- and dropping the only width
                 would fall back to the canvas's width ATTRIBUTE, i.e. the
                 backing store in CSS pixels, which is exactly the sea-of-black
                 layout the rule above exists to remove. Two declarations
                 degrade; one does not. */
              width: min(100vw, calc(100dvh * var(--aa-aspect, 1.3333)));
              height: auto; }
    /* The canvas takes focus so it can receive keys, and the browser then draws
       its focus ring around the entire play area. Removing a focus indicator is
       normally an accessibility regression, and it is not one here: the canvas
       is tabindex="-1", so it is NOT in the tab order -- it is focused
       programmatically, and nothing else on the page is focusable during play.
       The ring therefore conveys no navigational information; it just frames
       the game. Do not "restore" this without also giving the page something
       to tab between. */
    #canvas:focus, #canvas:focus-visible { outline: none; }
    /* THE GAME BOY LAYOUT. html.aa-gameboy is set by the script before the
       canvas is sized (see the touch decision above sizeCanvas). The picture is
       a square at the top: the contain-fit rule above already gives height:auto
       from the backing store's aspect, which the sizing block made 1, so only the
       width and the anchoring change. 60dvh is the same cap the sizing block
       applies, so CSS and backing store agree. The agreement is asserted at
       load -- PB2 in web/tools/portrait-boot-gate.steps compares the drawn box
       against the backing store -- but only for the UNCAPPED case a phone
       gives (412x915: min(100vw, 60dvh) is 100vw). The capped, tablet-shaped
       case is unmeasured and the two sides can differ by a pixel there: the
       script floors vh*0.6 to an integer and dvh is dynamic, so a browser UI
       bar that moves after load moves the CSS side and not the backing store. */
    html.aa-gameboy body    { align-items:flex-start; }
    html.aa-gameboy #canvas { width: min(100vw, 60vh); }
    @supports (height: 100dvh) {
      html.aa-gameboy #canvas { width: min(100vw, 60dvh); }
    }
    #overlay { position:fixed; inset:0; z-index:20; display:grid; place-content:center;
               gap:1rem; text-align:center; background:#111; }
    #status.error { color:#f77; max-width:32rem; }

    /* ---- PHASE 3: the touch overlay ------------------------------------
       Every rule below is dead on a desktop: #touch is `hidden` in the markup
       and only the touch-detection block in the script removes that attribute.
       The z-order is the one thing worth stating up front, because three fixed
       layers now share the page:

           25  #reloadchip  the "you rotated after load" notice.
           20  #overlay     the loading indicator (removed when main() runs).
           10  #touch       the controls themselves, above the canvas.

       touch-action:none on the whole overlay is load-bearing, not tidiness. It
       is what stops Android Chrome treating a steering tap as the start of a
       pan or a double-tap-to-zoom, which otherwise swallows the second tap of
       any quick left-right-left and inserts a ~300 ms delay before the first. */
    #touch { position:fixed; inset:0; z-index:10; touch-action:none;
             -webkit-user-select:none; user-select:none;
             -webkit-tap-highlight-color:transparent; }

    /* ---- PHONE FEEDBACK ROUND 2: FOUR BUTTONS BECOME ONE ----------------
       The maintainer asked for it in one line: "instead of showing 4 buttons,
       return can just be 'tap the screen'? esc can be top left?". So:

           Enter   a tap anywhere -- but ONLY when the game is not asking for
                   steering, because during a round the whole screen is already
                   the two turn zones.
           Escape  a button in the top-left corner, always.
           Up/Down kept, because the menus are lists and a list needs them; now
                   two buttons in the top strip instead of four, and gone
                   entirely while a round is running.

       WHICH OF THE TWO FULL-SCREEN LAYERS IS LIVE IS THE GAME'S ANSWER, NOT
       THE PAGE'S. #touch carries .aa-driving exactly while
       aa_web_input_context() (src/emscripten/eWebInput.cpp) reports a live
       local cycle and no menu on screen. Everything below is that one class
       switching two layers; there is no second source of truth.

       IT ALSO CLOSES A DEFECT PHASE 3 SHIPPED. The turn zones used to be live
       in menus too, and uMenu::HandleEvent routes SDLK_LEFT/SDLK_RIGHT to
       items[selected]->LeftRight() -- so on the build the maintainer is
       playing, a tap anywhere in a settings menu silently CHANGES the value of
       whatever row is selected. Making the zones round-only removes that. */
    #tapzone { position:absolute; inset:0; }
    #touch:not(.aa-driving) .tz      { display:none; }
    #touch.aa-driving      #tapzone  { display:none; }
    #touch.aa-driving      #touchpad { display:none; }

    /* THE TURN ZONES ARE HALF THE SCREEN EACH, and the size is the point. The
       whole game is two actions, so the correct target size is "as large as it
       can possibly be": a player steering at 30 units/s should never have to
       look at, or aim for, a control. Discrete buttons would be smaller targets
       bought with nothing. Held in landscape the two thumbs already rest on the
       lower-left and lower-right, so each half is under a thumb without moving
       the grip, and the mapping (left half turns left) needs no explaining. */
    .tz { position:absolute; top:0; bottom:0; width:50%;
          display:flex; align-items:center; }
    #tz-left  { left:0;  justify-content:flex-start; padding-left:2.5vw; }
    #tz-right { right:0; justify-content:flex-end;   padding-right:2.5vw; }
    /* The zones are invisible except for one faint chevron each, because a
       player who is given no hint at all taps nothing. It stays permanently
       rather than fading on a timer: a timer is state, and the chevron at 0.16
       is already below the threshold at which it competes with the game. */
    .tz::after { content:'';
                 width:5vmin; height:5vmin; opacity:.16;
                 border-left:.9vmin solid #fff; border-bottom:.9vmin solid #fff; }
    #tz-left::after  { transform:rotate(45deg); }
    #tz-right::after { transform:rotate(-135deg); }
    .tz.aa-down::after { opacity:.55; }

    /* THE MENU PAD IS AT THE TOP CENTRE, and that is the deliberate part.
       In landscape both thumbs live in the lower corners, so the top centre is
       the one region a steering hand cannot reach by accident -- and it is the
       one region of this game's screen that never holds anything the player has
       to act on: the menus put their title there and the in-game HUD puts the
       scores, speed and rubber gauges along the BOTTOM edge (see
       docs/evidence/phase3-touch/synkey-05-boot2-round1-driving.png). It is
       also symmetric, so it does not favour one hand. */
    /* The strip has its own dark backdrop rather than four floating
       translucent buttons, and that is legibility rather than decoration:
       without it the buttons sit ON the menu title and neither is readable
       (measured -- the first run of web/tools/touch-gate.steps put four ghost
       rectangles across the words "Language Settings"). Occluding the title is
       fine; smearing it is not. */
    #touchpad { position:absolute; top:0; left:50%; transform:translateX(-50%);
                display:flex; gap:.4rem; padding:.4rem;
                background:rgba(0,0,0,.5); border-radius:0 0 .7rem .7rem; }
    /* 3.4rem x 2.9rem is 54 x 46 CSS px, i.e. past the 44 px minimum touch
       target on both axes. On a 412 px-tall landscape phone the strip is 11%
       of the height, which is the price of the menus being usable at all. */
    #touchpad button, #escbtn {
      width:3.4rem; height:2.9rem; font:600 1.1rem/1 system-ui, sans-serif;
      color:#eee; background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.32); border-radius:.5rem;
      touch-action:none; -webkit-tap-highlight-color:transparent;
    }
    #touchpad button.aa-down, #escbtn.aa-down { background:rgba(255,255,255,.34); }

    /* ESCAPE IN THE TOP-LEFT CORNER -- INSET FROM IT, WHICH IS THE WHOLE
       CARE HERE. Android's back gesture is an edge swipe: a drag that STARTS
       inside a system gesture strip running down the left and right edges,
       typically 20-40 dp wide. A stationary tap does not trigger it, and this
       button is inset far enough that even a sloppy one starts outside the
       strip -- .6rem of margin puts its left edge at ~10 px and its centre,
       which is where a thumb actually lands, at ~37 px. The notification shade
       is the same shape of gesture from the top edge and the same .6rem
       applies. env(safe-area-inset-*) moves it clear of a notch, which in
       landscape is on one of the short edges and therefore exactly here.

       NOT VERIFIED ON A DEVICE, and it cannot be: Chrome's device emulation
       has no Android system gestures to collide with. What is stated above is
       the geometry and Android's documented gesture insets, not a measurement.
       If the corner turns out to fight the back gesture, the fix is to raise
       this one number. */
    #escbtn { position:absolute;
              top:calc(.6rem + env(safe-area-inset-top, 0px));
              left:calc(.6rem + env(safe-area-inset-left, 0px)); }

    /* THE PAD (M7). Hidden unless the html carries aa-gameboy; then it owns
       everything below the square, whatever the menu/round state -- the
       .aa-driving rules above hide the full-screen zones and the strip, and the
       pad replaces them. --aa-square is written by sizeCanvas, so the pad's top
       edge is the square's bottom edge to the pixel. */
    #pad { display:none; }
    html.aa-gameboy #pad {
      display:grid; position:absolute; left:0; right:0;
      top:var(--aa-square, 100vw); bottom:0;
      grid-template-columns: 1fr 1fr; align-items:center; justify-items:center;
      padding: 0 4vw calc(1rem + env(safe-area-inset-bottom, 0px));
      background:#111; }
    html.aa-gameboy .tz, html.aa-gameboy #touchpad, html.aa-gameboy #escbtn { display:none !important; }
    html.aa-gameboy #tapzone { bottom:auto; height:var(--aa-square, 100vw); }
    #pad-cross { display:grid; grid-template-columns:repeat(3, 4rem); grid-template-rows:repeat(3, 4rem); gap:.25rem; }
    .pad-up    { grid-area:1 / 2; }
    .pad-left  { grid-area:2 / 1; }
    .pad-right { grid-area:2 / 3; }
    .pad-down  { grid-area:3 / 2; }
    #pad-ab { display:grid; grid-template-columns:repeat(2, 5rem); grid-template-rows:repeat(2, 5rem); gap:.5rem; }
    .pad-b { grid-area:2 / 1; }
    .pad-a { grid-area:1 / 2; }
    .pad-btn { min-width:56px; min-height:56px; width:100%; height:100%;
               font:700 1.4rem/1 system-ui, sans-serif; color:#eee;
               background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
               border-radius:.6rem; touch-action:none; -webkit-user-select:none; user-select:none; }
    .pad-a, .pad-b { border-radius:50%; }
    .pad-btn.aa-down { background:rgba(255,255,255,.34); }

    #reloadchip { position:fixed; z-index:25; left:50%; bottom:.6rem;
                  transform:translateX(-50%);
                  display:flex; align-items:center; gap:.6rem;
                  padding:.5rem .7rem; border-radius:.6rem;
                  background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.25);
                  color:#eee; font:13px/1.3 system-ui, sans-serif; }
    #reloadchip button { color:#eee; background:rgba(255,255,255,.14);
                         border:1px solid rgba(255,255,255,.3);
                         border-radius:.4rem; padding:.35rem .6rem; font:13px system-ui, sans-serif; }
    /* ---- PHONE FEEDBACK: the diagnostic readout (?diag=1) ---------------
       z-index 40 puts it above everything, the reload chip included, because
       the numbers are most interesting exactly when something on the screen
       looks wrong enough to ask about. pointer-events:none is load-bearing, not
       tidiness: it sits over the left steering zone, and a panel that ate taps
       would break the game it is there to measure. */
    #diag { position:fixed; z-index:40; left:0; top:0; pointer-events:none;
            padding:.35rem .5rem; background:rgba(0,0,0,.72);
            color:#9f9; font:11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space:pre; border-radius:0 0 .4rem 0; }
    #diag.bad { color:#f88; }
  </style>
</head>
<body>

  <!--
    The loading indicator, and ONLY that. It is removed the moment the runtime
    is ready and main() is called; there is no button and nothing to click.
    Module.setStatus writes the download progress into #status, which is worth
    keeping: the .wasm and the preloaded .data are ~5 MB together and on a cold
    cache the page would otherwise be a black rectangle for several seconds.
  -->
  <div id="overlay">
    <h1>Armagetron Advanced</h1>
    <p id="status">Loading&hellip;</p>
  </div>
  <!--
    The width/height attributes are load-bearing, not decoration. The game's
    default video mode is "desktop resolution" (rScreen.cpp:114 constructs
    currentScreensetting with ArmageTron_Desktop), which means width+height==0
    and rScreen.cpp:626-629 substitutes whatever SDL reports as the desktop.
    Emscripten's SDL_GetVideoInfo answers that with canvas.width/canvas.height
    (libsdl.js:1400-1405) -- and SDL_SetVideoMode then writes the mode it was
    given straight back onto the same canvas. So the canvas's size is both the
    question and the answer: with no attributes here the canvas is HTML's
    default 300x150 and the game faithfully runs at 300x150.

    THESE TWO NUMBERS ARE NOW THE FALLBACK, NOT THE ANSWER. The script below
    overwrites them from window.screen before the game boots, which is the
    whole mechanism behind "high resolution": there is no runtime resize and no
    sr_ReinitDisplay call anywhere in it. 1024x768 is what a browser with no
    usable window.screen -- or a throw anywhere in that block -- still gets,
    which is the size every gate before M5 ran at.
  -->
  <canvas id="canvas" width="1024" height="768"
          tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

  <!--
    ---- PHASE 3: MINIMAL TOUCH SUPPORT --------------------------------------

    THE WHOLE THING IS SIX KEYS AND NO C++. Everything below turns a tap into a
    KeyboardEvent dispatched at `document` and lets the game's existing keyboard
    bindings do the rest. That this works at all is a measured fact, not an
    assumption -- see docs/evidence/phase3-touch/README.md: an event with
    isTrusted:false spends the game's own uActionTooltip counters exactly as a
    real key press does, and the menus were walked to a running round by
    dispatched events alone.

    IT STARTS HIDDEN AND STAYS HIDDEN ON A DESKTOP. `hidden` is on both roots
    here; only the touch-detection block in the script removes it. Nothing on
    this page changes for the browsers the Demo currently runs on.

    WHAT IS DELIBERATELY NOT HERE: brake, camera, chat, settings, and any way to
    rebind. Minimal means playable. Two of those would also inherit open input
    defects that are not this page's to fix -- `f` does not work even from a
    real keyboard, and three camera actions have no binding at all (PLAN.md's
    open items 4 and 8).

    ROUND 2 CHANGED THE LAYOUT AND NOT THE MECHANISM. Six keys still, still
    dispatched as KeyboardEvents at `document`; what moved is which surface
    sends which key and when. See the .aa-driving comment in the stylesheet.
  -->
  <div id="touch" hidden>
    <!--
      The tapzone below is Enter and nothing else. It is a LAYER rather than a
      button because "tap the screen" is what was asked for, and it is a
      SIBLING of
      the two turn zones rather than their parent, because the two are never
      live at the same time: .aa-driving on the container hides whichever the
      game is not asking for. The three controls below it come later in the
      document and therefore paint on top of it, which is what makes a tap on
      one of them not also count as a tap on the screen.
    -->
    <div id="tapzone" aria-hidden="true"></div>
    <div class="tz" id="tz-left"  data-aakey="ArrowLeft"  aria-hidden="true"></div>
    <div class="tz" id="tz-right" data-aakey="ArrowRight" aria-hidden="true"></div>
    <button type="button" id="escbtn" data-aakey="Escape"
            aria-label="Back or in-game menu">Esc</button>
    <div id="touchpad">
      <button type="button" data-aakey="ArrowUp"   aria-label="Menu up">&#9650;</button>
      <button type="button" data-aakey="ArrowDown" aria-label="Menu down">&#9660;</button>
    </div>
    <!--
      M7, THE PAD. Six elements that carry data-aakey and therefore ride the
      same pointer -> KeyboardEvent wiring as every control above; nothing else
      about them is new. Shown only under html.aa-gameboy (portrait on a touch
      device), in BOTH the menu and the round state -- the cross is Up/Down for
      the menus and Left/Right for the turns, A is Enter, B is Escape. The
      picture above stays a tap-for-Enter surface in menus (#tapzone, clipped to
      the square in the stylesheet) and is inert in a round.
      Every target is >= 56 CSS px on both axes -- above the 44 px this file
      already argues for the menu pad -- because these are held with thumbs, not
      tapped with fingertips.
    -->
    <div id="pad" aria-hidden="true">
      <div id="pad-cross">
        <button type="button" class="pad-btn pad-up"    data-aakey="ArrowUp"    aria-label="Menu up">&#9650;</button>
        <button type="button" class="pad-btn pad-left"  data-aakey="ArrowLeft"  aria-label="Turn left">&#9664;</button>
        <button type="button" class="pad-btn pad-right" data-aakey="ArrowRight" aria-label="Turn right">&#9654;</button>
        <button type="button" class="pad-btn pad-down"  data-aakey="ArrowDown"  aria-label="Menu down">&#9660;</button>
      </div>
      <div id="pad-ab">
        <button type="button" class="pad-btn pad-b" data-aakey="Escape" aria-label="Back or in-game menu">B</button>
        <button type="button" class="pad-btn pad-a" data-aakey="Enter"  aria-label="Enter">A</button>
      </div>
    </div>
  </div>

  <!--
    THE WORD "STRETCHED" WAS WRONG AND IS NOW GONE, which matters because it is
    the only place this port ever used it and the maintainer's phone report used
    it back. Measured (docs/evidence/phone-feedback/aspect/): the displayed box
    keeps the backing store's aspect ratio to 0.00 % in every configuration,
    including a deliberately falsified one -- `height:auto` on a replaced
    element makes stretching unrepresentable. What a rotation after load
    actually costs is SIZE and SHARPNESS: the picture is letterboxed into
    whatever fits, at the pixel count the other orientation had.
  -->
  <div id="reloadchip" hidden>
    <span>Rotated &mdash; still drawing at the shape and size it loaded at, so it
          is letterboxed and soft. Reload to redraw for this orientation.</span>
    <button type="button" id="reloadchip-go">Reload</button>
    <button type="button" id="reloadchip-x" aria-label="Dismiss">&times;</button>
  </div>

  <!--
    ?diag=1 ONLY. Empty, display:none and untouched unless the query parameter is
    present; the block that fills it is the last thing in the script. It exists
    because this port has no way to measure a phone -- the maintainer is the
    instrument, and an instrument needs a dial.
  -->
  <div id="diag" hidden></div>


  <script>
    const statusEl  = document.getElementById('status');
    const overlayEl = document.getElementById('overlay');

    // Both the .wasm and the .data package are fetched from inside
    // armagetronad.js with plain fetch()/XHR calls that are never awaited
    // with a .catch() by the generated loader itself -- a 404 or network
    // failure on either one surfaces only as an unhandled promise
    // rejection, not as a thrown exception armagetronad.js itself reports.
    // Module.onAbort, by contrast, only fires for the runtime's OWN
    // abort() calls (assertion failures, out-of-memory, a bad
    // Module.instantiateWasm) -- it does not fire for a missing file.
    // Without handling both, the failure mode looks identical to a slow
    // load: the page just sits on "Loading..." forever with the button
    // disabled and nothing else visible anywhere in the UI.
    function showFailure(message) {
      const text = 'Failed to load: ' + message +
        '. If you opened this page directly from disk (a file:// URL), ' +
        'that will not work -- serve it over HTTP instead.';
      if (document.body.contains(overlayEl)) {
        statusEl.textContent = text;
        statusEl.classList.add('error');
      } else {
        // The overlay was already removed by a successful start, so failure
        // happened after the game was already running -- put the message
        // somewhere visible instead of silently doing nothing.
        const banner = document.createElement('div');
        banner.textContent = text;
        banner.style.cssText =
          'position:fixed;top:0;left:0;right:0;padding:.5rem 1rem;' +
          'background:#500;color:#fff;font:14px system-ui, sans-serif;z-index:9999';
        document.body.prepend(banner);
      }
      console.error(message);
    }
    window.onerror = (message) => showFailure(String(message));
    window.onunhandledrejection = (event) => showFailure(String(event.reason));

    // Without preserveDrawingBuffer the canvas renders BLACK -- not "wrong
    // colours", not "flickering", solid black -- while the game underneath is
    // drawing a perfectly correct frame. Measured that way round: forcing the
    // flag on and reading the framebuffer back showed 544849 of 786432 pixels
    // non-black at a moment when Page.captureScreenshot returned an all-black
    // image.
    //
    // Why: WebGL discards the drawing buffer after every composite unless this
    // attribute is set. That is normally invisible, because a normal WebGL app
    // draws its whole frame inside one requestAnimationFrame callback, so a
    // composite can only ever happen at a frame boundary. This game does not
    // have a frame callback at all -- it is a 2003 desktop main loop that
    // Asyncify chops into pieces at every emscripten_sleep(), and those land
    // *inside* the frame: rSysDep::SwapGL() yields before the buffer swap,
    // tDelay()/sr_LimitFPS() yield again, and rConsoleGraph.cpp:67 yields once
    // per line of console output. The browser therefore composites at an
    // arbitrary mid-frame moment, discards the buffer, and the next composite
    // shows only whatever was drawn since -- usually nothing, because the
    // game's next act is glClear.
    //
    // Emscripten's SDL 1.2 shim builds the context attributes itself from the
    // SDL_GL_* attributes (libsdl.js:407-412) and offers no Module hook to add
    // to them, so the only place to inject this is the canvas's own
    // getContext, which GL.createContext calls as an instance method
    // (libwebgl.js:782-789). Patching the instance rather than
    // HTMLCanvasElement.prototype keeps the change to this one element, and
    // spreading the existing attributes rather than replacing them preserves
    // the depth/stencil/alpha/antialias choices SDL derived from the game's
    // own sr_SetGLAttributes call.
    //
    // This is a correctness fix, not a tuning knob: do not "optimise" it away.
    // The real fix is to align rendering to requestAnimationFrame, which is
    // M2/M5's problem; until then this is what makes the picture appear.
    (() => {
      const canvas = document.getElementById('canvas');
      const realGetContext = canvas.getContext.bind(canvas);
      canvas.getContext = (type, attrs) => realGetContext(
        type,
        String(type).startsWith('webgl')
          ? Object.assign({}, attrs || {}, { preserveDrawingBuffer: true })
          : attrs
      );
    })();

    // ---- M5: the canvas is sized from the VIEWPORT, before the game boots -
    //
    // WHY THIS IS THE WHOLE FIX. The comment on the <canvas> above spells out
    // the mechanism: the game's default video mode is ArmageTron_Desktop, so
    // it asks SDL for the desktop size, and Emscripten answers that question
    // with canvas.width/canvas.height. Setting them here -- before
    // armagetronad.js is even fetched, and therefore long before main() calls
    // SDL_SetVideoMode -- makes the game INITIALISE at this resolution. There
    // is no resize, no second SDL_SetVideoMode and no sr_ReinitDisplay
    // involved, which is deliberate: that path is a separate, diagnosed
    // problem (docs/evidence/m5-defect-a-resolution) and this does not touch
    // it.
    //
    // WHY window.innerWidth/innerHeight AND NOT window.screen. The thing the
    // player is looking at is the browser window, not the display: screen
    // includes the OS menu bar, the browser's own toolbars and, on a
    // multi-monitor desktop, a geometry that has nothing to do with where this
    // window is. Sizing from the viewport also makes the load-time state
    // exactly 1:1 -- backing store, CSS size and screen pixels are all the same
    // number, so nothing is scaled and there is no aspect ratio to choose: the
    // aspect IS whatever shape the window is. F11 before loading the page
    // therefore gives a genuinely native-resolution fullscreen game with no
    // Fullscreen API code on this page at all, which is the right way round --
    // forcing a browser into fullscreen belongs to the visitor, not to us.
    //
    // THE SIZE IS TAKEN ONCE, AT LOAD, AND A LATER WINDOW RESIZE DOES NOT MOVE
    // IT. That is deliberate and it is the whole reason this approach is safe;
    // do not "fix" it with a resize listener without reading this paragraph.
    // Writing canvas.width later WOULD resize the drawing buffer, but the
    // game's viewport, projection and HUD layout were all computed from what
    // it read at boot (sr_screenWidth/sr_screenHeight), so the picture would be
    // rendered for the old shape into the new buffer. Making it follow
    // properly means calling SDL_SetVideoMode again, i.e. sr_ReinitDisplay --
    // the path this task exists to avoid. So the CSS rule on #canvas scales the
    // existing buffer instead: grow the window and the picture goes slightly
    // soft, shrink it and it downsamples cleanly, press F11 and it scales up.
    // Reload and it is crisp again at the new size. A resize listener that
    // resized the buffer AND re-inited is worth TRYING one day -- 4c measured
    // sr_ReinitDisplay as working, with textures surviving and no context loss
    // -- but it is a live re-init on every drag of a window edge, and it is not
    // being built here.
    //
    // devicePixelRatio IS APPLIED, and the reason is a measurement that
    // falsified the obvious prediction. The prediction was that dpr would be
    // unaffordable: this machine's display is 3360x1890 CSS px at dpr 2, so a
    // maximised window is ~24 megapixels against the 0.79 this port used to run
    // at. docs/evidence/m5-startup swept nine backing-store sizes through the
    // M2 frame sampler and the frame-time distribution DID NOT MOVE: 60 fps
    // median at 0.79 Mpx and 60 fps median at 33.2 Mpx (7680x4320), with p50
    // frame time pinned at 16.7 ms -- the MAX_FPS 60 cap -- the whole way, and
    // p90/p99 flat within noise. This port is not fill-bound. Its per-frame
    // cost is the CPU side of -sLEGACY_GL_EMULATION's immediate-mode
    // translation, which does not depend on the resolution at all. Applying dpr
    // is what makes the canvas 1:1 with the PHYSICAL pixels of a HiDPI panel
    // rather than with its CSS pixels; on a dpr-1 display the two are the same
    // number and this multiplication does nothing.
    //
    // THE CAP IS THEREFORE NOT A FRAME-RATE CAP, and saying so is the point.
    // Nothing measured here asks for one. It is an allocation bound for GPUs
    // this sweep could not run on: the drawing buffer is colour + depth +
    // stencil with preserveDrawingBuffer, ~8 bytes per pixel, so an uncapped
    // 8K panel would ask a driver for a quarter of a gigabyte before the game
    // draws anything.
    //
    // WHY 3840x2160 AND NOT SOMETHING SMALLER. Because a dpr-1 4K window
    // reaches exactly that area on its own, so this cap is the worst case
    // WHETHER OR NOT dpr is applied -- applying dpr adds no new worst case, it
    // only raises the resolution on a HiDPI panel up to the same bound.
    // Measured directly at 3840x2160: 60 fps median, 58 fps worst whole second,
    // p50 16.7 ms. PLAN.md's Demo bar is 30.
    //
    // The cap is applied by AREA with the window's aspect ratio preserved,
    // because the aspect ratio is what the game builds its projection from:
    // rViewport::Perspective derives `aspectratio` from sr_screenWidth /
    // sr_screenHeight and feeds it to glFrustum, widening the horizontal fov
    // for anything past 1.5 rather than stretching the image (and
    // rViewport::GetSubBox clamps the HUD with sr_HUDMaxWidth for the same
    // reason). Clamping width and height independently would hand it a shape
    // the window does not have.
    //
    // window.AA_CANVAS_SIZE IS A MEASUREMENT HOOK AND NOTHING ELSE. Nothing in
    // the shipped page defines it. docs/evidence/m5-startup's generator writes
    // control pages by injecting one <script> that sets it immediately after
    // <body>, which is how the sweep holds everything except the resolution
    // constant. Keep it: without it a resolution measurement has to be a
    // rebuild, and a rebuild is not the same binary.
    const MAX_CANVAS_PIXELS = 3840 * 2160;

    // ?dpr=N IS AN EXPERIMENT, AND IT IS THE ONLY WAY THIS PORT CAN ASK A PHONE
    // A QUESTION. Nothing in the shipped flow sets it and it is not linked from
    // anywhere; the default remains window.devicePixelRatio exactly as before.
    //
    // WHAT IT IS FOR, precisely. This port is CPU-bound on a desktop, not
    // fill-bound: docs/evidence/m5-startup swept nine backing-store sizes and
    // the frame-time distribution DID NOT MOVE -- 60 fps median at 0.79 Mpx and
    // 60 fps median at 33.2 Mpx, p50 pinned at 16.7 ms throughout. Whether that
    // also holds on a phone GPU is unknown and cannot be measured from here.
    // ?dpr=1 loads the SAME BUILD at 1/dpr^2 of the pixels (1/9 on a dpr-3
    // phone), so one A/B on the device decides it:
    //
    //     it feels smoother at ?dpr=1  -> fill-bound, resolution is the lever
    //     it feels identical           -> CPU-bound, resolution is a red herring
    //
    // A value out of (0, 8] is ignored rather than clamped, because a typo that
    // silently half-ran the experiment would be worse than one that visibly
    // did nothing -- the [DISPLAY] line says which happened either way.
    const readNumberParam = (name, min, max) => {
      try {
        const raw = new URLSearchParams(location.search).get(name);
        if (raw === null) return null;
        const v = parseFloat(raw);
        if (!isFinite(v) || v < min || v > max) {
          console.log('[DISPLAY] ?' + name + '=' + raw + ' ignored (want ' +
                      min + '..' + max + ')');
          return null;
        }
        return v;
      } catch (e) { return null; }  // a browser without URLSearchParams
    };

    // THE PER-AXIS GPU LIMIT, AND WHY IT IS NOT THE SAME THING AS THE AREA CAP
    // ABOVE. MAX_CANVAS_PIXELS is an allocation bound chosen by this page. This
    // is the driver's own hard limit, and exceeding it does not fail loudly: a
    // WebGL drawing buffer larger than MAX_RENDERBUFFER_SIZE / MAX_VIEWPORT_DIMS
    // is silently CLAMPED, so gl.drawingBufferWidth/Height come back smaller
    // than canvas.width/height while the attributes keep the numbers you asked
    // for. Everything downstream then disagrees with the truth: the game reads
    // canvas.width/height through SDL_GetVideoInfo and builds glViewport and
    // glFrustum from them, and the browser scales the real, smaller buffer over
    // the element box. If the clamp is not proportional, THAT is a genuinely
    // stretched picture -- and it is the only mechanism left that can produce
    // one on this page (docs/evidence/phone-feedback rules out both the CSS and
    // the projection by measurement).
    //
    // Desktop GPUs report 16384 or 32768 here, so a 4K window never comes near
    // it and this code is inert -- which is exactly why no desktop test could
    // ever have found the problem. Phone GPUs commonly report 4096, and a
    // 1440p phone in landscape at dpr 3.5 asks for 3122 -- close enough that
    // the next phone is not.
    //
    // Measured on a THROWAWAY 1x1 canvas rather than on #canvas: creating a
    // context on the real canvas here would hand SDL a context it did not make,
    // with attributes it did not choose. A discarded context costs a few ms and
    // tells the truth about the same driver.
    const gpuAxisLimit = () => {
      try {
        const probe = document.createElement('canvas');
        probe.width = probe.height = 1;
        const gl = probe.getContext('webgl') ||
                   probe.getContext('experimental-webgl');
        if (!gl) return null;
        const rb = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 0;
        const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
        const vpMin = (vp && vp.length === 2) ? Math.min(vp[0], vp[1]) : 0;
        const lim = Math.min(rb || Infinity, vpMin || Infinity);
        // Losing the context immediately keeps this from occupying one of the
        // browser's small pool of live WebGL contexts for the session.
        const lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
        return isFinite(lim) && lim > 0 ? lim : null;
      } catch (e) { return null; }
    };

    // WHICH WAY UP IS THE VIEWPORT? Asked of innerWidth/innerHeight FIRST and
    // of the media query only as a fallback, and the order is a bug fix rather
    // than a preference. innerWidth/innerHeight is the quantity that actually
    // matters -- it is what sizeCanvas() reads and therefore what the game's
    // projection is built from -- and '(orientation: portrait)' is a second
    // opinion about it. Measured: under Chrome's device emulation, on a page
    // that was painting nothing at the time, a metrics override updated
    // innerWidth/innerHeight immediately while the media query's change event
    // did not arrive for SIXTY-NINE SECONDS, apparently waiting for a paint
    // that an idle page never produced
    // (docs/evidence/phone-feedback/README.md has the transcript). Trusting the
    // query alone therefore leaves a page's own idea of which way up it is
    // depending on something else repainting it.
    const viewportIsPortrait = () => {
      const w = window.innerWidth, h = window.innerHeight;
      if (w > 0 && h > 0) return h > w;
      try { return window.matchMedia('(orientation: portrait)').matches; }
      catch (e) { return false; }
    };

    // ---- is this a touch device? ------------------------------------
    //
    // '(hover: none) and (pointer: coarse)' is the media query for "the
    // primary input is a finger", which is the question being asked -- a
    // touchscreen laptop answers `true` to navigator.maxTouchPoints > 0 and
    // must NOT get an overlay over its keyboard-driven game.
    //
    // ?touch=1 / ?touch=0 override it, for two reasons that are not the same:
    // a harness needs to force the overlay on under device emulation (whose
    // media features are not guaranteed to track the metrics override), and a
    // visitor on a device this query gets wrong needs a way out. Nothing in
    // the shipped flow sets either.
    const decideTouch = () => {
      try {
        const q = new URLSearchParams(location.search).get('touch');
        if (q === '1') return { on:true,  why:'?touch=1' };
        if (q === '0') return { on:false, why:'?touch=0' };
      } catch (e) { /* a browser without URLSearchParams falls through */ }
      try {
        const m = window.matchMedia('(hover: none) and (pointer: coarse)');
        return { on: m.matches, why: 'media query -> ' + m.matches };
      } catch (e) { return { on:false, why:'matchMedia threw: ' + e }; }
    };

    // THE TOUCH DECISION IS MADE HERE, BEFORE SIZING, because the Game Boy
    // layout is a decision about the backing store's SHAPE and sizeCanvas runs
    // at parse time, ~90 lines before the touch block used to decide. Same
    // inputs (?touch= then the media query), same log line, one place.
    const touchDecision = decideTouch();
    // Published so the three later blocks that need to know -- the camera
    // tuning, the sparks default and the diagnostic readout -- ask this
    // decision rather than re-deriving it and risking a different answer. The
    // touch overlay is not one of them: it is in this same scope and reads the
    // lexical touchDecision directly.
    window.AA_TOUCH = touchDecision.on;
    // One machine-readable line, so a gate can assert which branch ran rather
    // than inferring it from a screenshot.
    console.log('[TOUCH] enabled=' + touchDecision.on + ' (' + touchDecision.why + ')' +
                ' maxTouchPoints=' + (navigator.maxTouchPoints || 0));
    // GAME BOY = a touch device that LOADED in portrait. Landscape keeps the
    // full-screen layout; a desktop never gets this whatever its window shape.
    window.AA_GAMEBOY = window.AA_TOUCH && viewportIsPortrait();
    document.documentElement.classList.toggle('aa-gameboy', !!window.AA_GAMEBOY);
    console.log('[DISPLAY] layout=' + (window.AA_GAMEBOY ? 'gameboy' : 'full'));

    let sizedForPortrait = null;   // the orientation the backing store is FOR
    // sizeCanvas() IS CALLED ONCE, AT PARSE TIME -- the single call is on the
    // line right after the function -- AND ONLY EVER BEFORE main(). It is NOT a
    // resize handler and must not become one: the long paragraph above about
    // sr_ReinitDisplay still stands.
    //
    // IT RUNS AFTER THE TOUCH DECISION ABOVE, AND THAT ORDER IS LOAD-BEARING.
    // The Game Boy branch inside reads window.AA_GAMEBOY to choose the backing
    // store's SHAPE, and a shape is not a size: the game reads it once through
    // SDL_GetVideoInfo and builds glViewport and glFrustum from it, so there is
    // no later moment at which a wrong one could be corrected. That is the
    // whole reason the decision was hoisted out of the touch block below.
    //
    // It is a named function with exactly ONE caller rather than the IIFE it
    // started as. Nothing in the code requires that shape any more; what it
    // still buys is the `why` argument, which names the call site in the
    // [DISPLAY] line so a transcript says which call produced a given size.
    // That is not an invitation to add a second caller -- see above.
    function sizeCanvas(why) {
      const canvas = document.getElementById('canvas');
      // Told to the stylesheet rather than derived by it, because CSS has no
      // way to read a canvas's width/height attributes. See the #canvas rule.
      const publishAspect = () => document.documentElement.style
        .setProperty('--aa-aspect', String(canvas.width / canvas.height));
      try {
        sizedForPortrait = viewportIsPortrait();
        const forced = window.AA_CANVAS_SIZE;
        if (Array.isArray(forced) && forced.length === 2 &&
            forced[0] > 0 && forced[1] > 0) {
          canvas.width  = Math.round(forced[0]);
          canvas.height = Math.round(forced[1]);
          publishAspect();
          console.log('[DISPLAY] AA_CANVAS_SIZE override -> canvas ' +
                      canvas.width + 'x' + canvas.height);
          return;
        }
        const dprOverride = readNumberParam('dpr', 0.05, 8);
        const dpr = dprOverride !== null ? dprOverride
                                         : (window.devicePixelRatio || 1);
        const vw = window.innerWidth, vh = window.innerHeight;
        let w = Math.floor(vw * dpr);
        let h = Math.floor(vh * dpr);
        if (!(w > 0 && h > 0)) {
          console.log('[DISPLAY] no usable viewport, keeping canvas ' +
                      canvas.width + 'x' + canvas.height);
          publishAspect();
          return;
        }
        // THE GAME BOY SQUARE. Side = the CSS width, capped at 60 % of the CSS
        // height so the pad below keeps at least 40 % on a tall-but-wide tablet.
        // Aspect 1 is the best of the three shapes this game gets on a phone:
        // rViewport::Perspective makes it 90 x 90 degrees (landscape ~111 x 67,
        // full portrait ~131 vertical). docs/evidence/phone-round2/fov/README.md.
        let squareCss = 0;
        if (window.AA_GAMEBOY) {
          squareCss = Math.min(vw, Math.floor(vh * 0.6));
          w = h = Math.floor(squareCss * dpr);
        }
        const px = w * h;
        let capped = false;
        if (px > MAX_CANVAS_PIXELS) {
          const k = Math.sqrt(MAX_CANVAS_PIXELS / px);
          w = Math.max(1, Math.round(w * k));
          h = Math.max(1, Math.round(h * k));
          capped = true;
        }
        // Both axes are scaled by the SAME factor, for the same reason the area
        // cap is: the aspect ratio is what rViewport::Perspective builds the
        // frustum from, so clamping the axes independently would hand the game
        // a shape the window does not have -- i.e. it would CAUSE the defect
        // this clamp exists to avoid.
        const axisLimit = gpuAxisLimit();
        let axisClamped = false;
        if (axisLimit && (w > axisLimit || h > axisLimit)) {
          const k = Math.min(axisLimit / w, axisLimit / h);
          w = Math.max(1, Math.floor(w * k));
          h = Math.max(1, Math.floor(h * k));
          axisClamped = true;
        }
        canvas.width  = w;
        canvas.height = h;
        publishAspect();
        // Told to the stylesheet for the same reason --aa-aspect is: CSS cannot
        // read these numbers. Set in BOTH layouts -- 0px when this is not a
        // Game Boy load -- because it is ONE quantity, "how tall the square
        // is", and 0px is its true answer when there is no square. Publishing
        // it in both branches is what lets a reader (a gate, the diagnostic
        // readout) take the variable as the page's own answer instead of having
        // to tell "no square" apart from "never set". The var(--aa-square,
        // 100vw) fallback the pad's rules carry is for that second case only --
        // sizeCanvas threw before this line -- and not for the full layout,
        // whose rules are all html.aa-gameboy-scoped and never read it.
        document.documentElement.style.setProperty('--aa-square',
          window.AA_GAMEBOY ? squareCss + 'px' : '0px');
        console.log('[DISPLAY] ' + why + ': viewport ' + vw + 'x' + vh +
                    ' dpr ' + dpr +
                    (dprOverride !== null ? ' (?dpr override)' : '') +
                    ' -> canvas ' + w + 'x' + h +
                    ' aspect ' + (w / h).toFixed(4) +
                    (capped ? ' (capped at ' + MAX_CANVAS_PIXELS + ' px)' : '') +
                    ' gpu-axis-limit ' + (axisLimit || 'unknown') +
                    (axisClamped ? ' (CLAMPED to it)' : '') +
                    (window.AA_GAMEBOY ? ' gameboy square ' + squareCss + 'css'
                                       : ''));
      } catch (e) {
        // Falling back to the attributes on the element is a working game at
        // 1024x768, so this must never be allowed to escape and turn into
        // showFailure's red banner over a page that never starts.
        console.log('[DISPLAY] sizing failed, keeping canvas ' +
                    canvas.width + 'x' + canvas.height + ': ' + e);
      }
    }
    sizeCanvas('at load');

    // ---- PHASE 3: TOUCH INPUT ------------------------------------------
    //
    // THE MECHANISM, AND WHY IT IS ALLOWED TO BE THIS SMALL. Emscripten's SDL 1.2
    // shim registers keydown/keyup/keypress on `document` (its SDL_Init sets
    // keyboardListeningElement = document) and SDL.receiveEvent pushes whatever
    // it is handed straight into SDL.events. It NEVER reads event.isTrusted. The
    // only property on the delivery path that carries meaning is event.keyCode,
    // which SDL.lookupKeyCodeForEvent maps through SDL.keyCodes -- 37 -> 1104 and
    // 39 -> 1103, which are exactly the keysyms this game's user.cfg binds
    // CYCLE_TURN_LEFT and CYCLE_TURN_RIGHT to. So a hand-built KeyboardEvent is
    // indistinguishable from a real key press to everything downstream.
    //
    // THAT IS MEASURED, NOT REASONED. It was the gate for this whole phase,
    // because trust demonstrably matters elsewhere in this port (a synthetic
    // click is not a user gesture, which is why M4's audio work routed around
    // it). web/tools/synthetic-key-gate.steps spends the game's own
    // uActionTooltip counters with dispatched events -- CYCLE_TURN_LEFT_TOOLTIP
    // 2 -> 0 from three synthetic ArrowLefts, CYCLE_TURN_RIGHT_TOOLTIP 3 -> 0
    // from four synthetic ArrowRights -- and uBindPlayer::DoActivate decrements
    // those ONLY when the player's cycle object accepted and executed the turn.
    // docs/evidence/phase3-touch/README.md has the transcript and the caveats.
    //
    // DISPATCHED AT `document`, NOT AT THE CANVAS. Both work (the gate measured
    // both), but the canvas only works by BUBBLING to document, so it depends on
    // where in the tree the target sits. Aiming at the listener's own element
    // removes that dependency entirely.
    //
    // NO ARTIFICIAL MINIMUM HOLD BETWEEN keydown AND keyup, and this was a
    // deliberate decision rather than an omission. It looks like a race -- a
    // flick tap could produce both within a few milliseconds, faster than the
    // game's Asyncify-chopped loop yields -- and it is not one: receiveEvent
    // only ever pushes onto the SDL.events array, and SDL_PollEvent drains that
    // array in order whenever the game next asks. The turn fires on the queued
    // keydown regardless of how long ago it was queued. A timer here would add a
    // real hazard (a deferred keyup overtaking the next press of the same key)
    // to remove an imaginary one.
    (() => {
      const KEYCODES = { ArrowLeft:37, ArrowRight:39, ArrowUp:38, ArrowDown:40,
                         Enter:13, Escape:27 };
      // `key` and `code` are the same string for all six of these, which is a
      // property of the six and not a general rule. They are set because they
      // cost nothing and because receiveEvent does consult event.key (only to
      // decide whether to preventDefault on Backspace and Tab); keyCode is the
      // one that decides which action the game performs.
      const sendKey = (type, name) => {
        const kc = KEYCODES[name];
        document.dispatchEvent(new KeyboardEvent(type, {
          key: name, code: name, keyCode: kc, which: kc,
          bubbles: true, cancelable: true,
        }));
      };

      const touchEl = document.getElementById('touch');
      const chipEl = document.getElementById('reloadchip');
      // REUSED, NOT RE-DERIVED. The decision, its [TOUCH] line and
      // window.AA_TOUCH all moved above sizeCanvas (see the block there), so
      // the overlay and the backing store's shape can never disagree about
      // whether this is a touch device.
      const decision = touchDecision;
      if (!decision.on) return;
      touchEl.hidden = false;

      // ---- wiring ------------------------------------------------------
      //
      // Pointer events rather than touch events: they are what Chrome emits for
      // a finger AND for a mouse, so the same three handlers cover a real phone
      // and a device-emulation run, and setPointerCapture guarantees the keyup
      // even when the finger slides off the element it started on -- which on a
      // half-screen steering zone it constantly does.
      //
      // The map is keyed by pointerId so two thumbs work: pressing both halves
      // holds both turn keys, and lifting one releases only that one.
      const active = new Map();
      const down = (ev) => {
        const el = ev.currentTarget;
        const name = el.dataset.aakey;
        if (!name || active.has(ev.pointerId)) return;
        // preventDefault suppresses the compatibility mouse events and the
        // double-tap-zoom gesture. It does NOT stop propagation, which matters:
        // Emscripten's $autoResumeAudioContext listens for a real pointerdown/
        // touchstart on document to resume the AudioContext, and that gesture
        // has to keep reaching it or a phone visitor gets a silent game.
        ev.preventDefault();
        active.set(ev.pointerId, { name, el });
        el.classList.add('aa-down');
        try { el.setPointerCapture(ev.pointerId); } catch (e) { /* not fatal */ }
        sendKey('keydown', name);
      };
      const up = (ev) => {
        const a = active.get(ev.pointerId);
        if (!a) return;
        active.delete(ev.pointerId);
        a.el.classList.remove('aa-down');
        sendKey('keyup', a.name);
      };
      for (const el of touchEl.querySelectorAll('[data-aakey]')) {
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
      }

      // ---- PHONE FEEDBACK ROUND 2: which key does a tap on the screen mean?
      //
      // THE GAME ANSWERS, NOT THE PAGE. src/emscripten/eWebInput.cpp exports
      // aa_web_input_context(), two bits: a uMenu is on screen, and a local
      // player has a cycle that is Alive(). The page cannot derive either --
      // a menu item can start the game, a round can end by itself, and Escape
      // mid-round opens the in-game menu, none of which reaches this script.
      //
      // THE POLICY IS HERE AND THE FACTS ARE THERE, deliberately. "Driving"
      // means a live cycle AND no menu: the in-game menu is reached with
      // Escape in the middle of a round, so the cycle is still alive while a
      // menu is asking for Enter, and a rule that looked only at the cycle
      // would put the turn zones over the top of that menu.
      //
      // CALLING INTO WASM FROM HERE IS SAFE FOR ONE SPECIFIC REASON, not as a
      // general licence: aa_web_input_context() reads a static bool and walks
      // at most four pointers, so it cannot reach emscripten_sleep, so
      // Asyncify does not instrument it and there is no second stack unwind to
      // start on top of the one the game is nearly always parked in. The same
      // argument the unload backstop stands on, and this one is weaker still
      // because it writes nothing. Before main() has run the export is a
      // makeInvalidEarlyAccess stub whose body is abort(), which is what the
      // gameStarted test guards -- `typeof` would report it as a function.
      const AA_CTX_MENU = 1, AA_CTX_DRIVING = 2;    // src/emscripten/eWebInput.cpp
      const readContext = () => {
        try {
          // gameStarted IS INSIDE THE try ON PURPOSE. It is a `let` declared
          // further down this same script, so the first applyContext() below
          // -- which runs while this IIFE is still executing -- reads it
          // inside its temporal dead zone and throws a ReferenceError. That
          // is a correct answer, not an error: before main() there is no
          // context, and 0 is what this returns. Moving the test outside the
          // try would make the page fail to load.
          if (!gameStarted) return 0;
          return Module._aa_web_input_context() | 0;
        } catch (e) { return 0; }
      };
      // 0 is the honest answer for "the game has not started" and for any
      // throw, and 0 means NOT driving, i.e. a tap is Enter. That is the safe
      // side of the failure: a tap that confirms nothing during a round the
      // player is not in costs a tap, while a tap that TURNS THEM inside a
      // menu changes a setting they never chose.
      const isDriving = (ctx) => (ctx & AA_CTX_DRIVING) !== 0 &&
                                 (ctx & AA_CTX_MENU) === 0;

      // RELEASING THE HELD KEYS ON EVERY CHANGE IS A BUG FIX, NOT TIDINESS. A
      // player holding a turn when their cycle dies would otherwise have the
      // zone go display:none under their thumb, and a pointerup on an element
      // with no box is not guaranteed to arrive -- so ArrowLeft would stay
      // down for ever, from the game's point of view, and steer the next
      // round. Pointer capture does not save this: the specification releases
      // it implicitly on removal from the document, and browsers differ on
      // whether display:none counts.
      const releaseAllKeys = (why) => {
        if (!active.size) return;
        for (const [, a] of active) {
          a.el.classList.remove('aa-down');
          sendKey('keyup', a.name);
        }
        console.log('[TOUCH] released ' + active.size + ' held key(s): ' + why);
        active.clear();
      };

      let lastCtx = -1;
      const applyContext = () => {
        const ctx = readContext();
        if (ctx === lastCtx) return;
        const wasDriving = lastCtx >= 0 && isDriving(lastCtx);
        lastCtx = ctx;
        const driving = isDriving(ctx);
        if (driving !== wasDriving) releaseAllKeys('input context changed');
        touchEl.classList.toggle('aa-driving', driving);
        // One machine-readable line per transition, so the touch gate can
        // assert the state the game was in rather than inferring it from a
        // screenshot. It is per TRANSITION, not per poll: at 4 Hz for a whole
        // round the latter would bury the transcript it is meant to explain.
        console.log('[TOUCH] context ' + ctx +
                    ' (menu ' + ((ctx & AA_CTX_MENU) ? 'yes' : 'no') +
                    ', cycle ' + ((ctx & AA_CTX_DRIVING) ? 'alive' : 'no') +
                    ') -> ' + (driving ? 'STEERING' : 'TAP=ENTER'));
      };
      window.AA_INPUT_CONTEXT = readContext;   // for the gate, not for the page
      // 250 ms is the appearance only -- a control that is a quarter-second
      // late to appear is invisible to a player, and every tap re-reads the
      // context itself, so nothing acts on a stale value.
      setInterval(applyContext, 250);
      applyContext();

      // ---- the tap-anywhere layer ---------------------------------------
      //
      // ON pointerup AND NOT ON pointerdown, and after a movement and time
      // test, because "tap the screen" has to mean a tap. Enter is a
      // destructive key in a menu -- it commits whatever row is selected --
      // and a layer that fired on first contact would commit on a thumb
      // brushing the glass while the player is reading. 24 px and 700 ms are
      // the usual click-slop shape; anything longer or further is a drag and
      // is ignored rather than treated as a press.
      //
      // THE CONTEXT IS RE-READ AT pointerup, not trusted from the poll. The
      // 250 ms timer above only decides what is on screen; a round that ended
      // between a finger landing and lifting must not send a turn.
      const TAP_SLOP_PX = 24, TAP_MS = 700;
      const taps = new Map();
      const tapzone = document.getElementById('tapzone');
      tapzone.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();   // the same reason as `down` above; see it
        taps.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, t: Date.now() });
      });
      const endTap = (ev, fire) => {
        const t = taps.get(ev.pointerId);
        if (!t) return;
        taps.delete(ev.pointerId);
        if (!fire) return;
        const moved = Math.hypot(ev.clientX - t.x, ev.clientY - t.y);
        const held = Date.now() - t.t;
        if (moved > TAP_SLOP_PX || held > TAP_MS) {
          console.log('[TOUCH] tap ignored (moved ' + Math.round(moved) +
                      'px, held ' + held + 'ms)');
          return;
        }
        if (isDriving(readContext())) {
          console.log('[TOUCH] tap ignored: the game is asking for steering');
          return;
        }
        sendKey('keydown', 'Enter');
        sendKey('keyup', 'Enter');
      };
      tapzone.addEventListener('pointerup',     (ev) => endTap(ev, true));
      tapzone.addEventListener('pointercancel', (ev) => endTap(ev, false));

      // ---- orientation: an OFFER to reload, never a hold ----------------
      //
      // ORIENTATION AFTER LOAD IS A RELOAD, OFFERED, NEVER FORCED. The backing
      // store and the projection are built once, before main() (see sizeCanvas);
      // a rotation after that would need sr_ReinitDisplay, which M5 measured to
      // work and which this page still declines as a larger claim than a reload.
      // The chip below is the offer. It appears whenever the orientation the page
      // is in differs from the one it was sized for -- both directions -- and its
      // text says what the reload costs, which is the round in progress.
      // WHAT USED TO BE HERE: a boot HOLD in portrait, a full-screen "turn your
      // phone" prompt, a remembered "Play in portrait" answer (localStorage
      // aa.portrait) and ?portrait=ask to forget it. M7 made portrait a layout of
      // its own (a square picture, a pad below), so none of that has a job. A
      // returning visitor's stored aa.portrait key is simply never read.
      let mq = null;
      try { mq = window.matchMedia('(orientation: portrait)'); } catch (e) { mq = null; }
      let chipDismissed = false;
      const applyOrientation = () => {
        const portrait = viewportIsPortrait();
        if (!chipDismissed) chipEl.hidden = (portrait === sizedForPortrait);
        console.log('[TOUCH] orientation portrait=' + portrait +
                    ' (sized for portrait: ' + sizedForPortrait + ')');
      };
      document.getElementById('reloadchip-go')
        .addEventListener('click', () => location.reload());
      document.getElementById('reloadchip-x')
        .addEventListener('click', () => { chipDismissed = true; chipEl.hidden = true; });
      const onOrientationChange = (why) => { applyOrientation(); };
      // addListener is the pre-2019 spelling; Safari needed it until 14. Both
      // are tried because the cost is one line and the failure mode of neither
      // firing is a chip that never appears. resize and orientationchange are
      // here for the same reason: no single one of these is trustworthy on
      // every device, and they are all idempotent.
      if (mq && mq.addEventListener) mq.addEventListener('change', () => onOrientationChange('media query'));
      else if (mq && mq.addListener) mq.addListener(() => onOrientationChange('media query'));
      window.addEventListener('resize', () => onOrientationChange('resize'));
      window.addEventListener('orientationchange', () => onOrientationChange('orientationchange'));
      applyOrientation();
    })();

    // ---- PHONE FEEDBACK: "the bike is tiny" -----------------------------
    //
    // THE MEASUREMENT FIRST. At a phone's landscape aspect (2745x1050, a
    // Pixel-class device at dpr 3 with the URL bar showing) the player's own
    // cycle is 23 x 63 backing-store pixels during the round-start countdown --
    // 6 % of the screen HEIGHT and 2.2 % of its width. That is not a phone bug:
    // rViewport::Perspective fixes the vertical field of view for every aspect
    // above 1.5 and widens only the horizontal, so a cycle occupies the same
    // fraction of screen height on a phone as on a desktop. The phone's screen
    // is simply small and at arm's length.
    //
    // WHAT WAS MEASURED, at that same geometry, from four full runs
    // (docs/evidence/phone-feedback/camera/):
    //
    //   stock (fov 90)                     23 x 63 px    horizon visible
    //   START_FOV_1 78                     29 x 75 px    horizon visible
    //   START_FOV_1 69                     33 x 80 px    horizon at the corners
    //   camera distance x0.5               47 x 122 px   horizon visible
    //
    // Halving the camera distance wins on both counts: 1.94x linear against
    // 1.27x, AND it keeps the arena rim in frame, which narrowing the field of
    // view does not -- at fov 69 the horizon is already leaving the top of the
    // screen, and at 60 the frame is floor and nothing else. So the lever is
    // the camera, not the fov.
    //
    // WHY THIS IS DONE HERE AND NOT AS A COMPILED DEFAULT, which is what M4
    // task 3 established as the right home for a preference. Because the
    // compiled default is not reachable for these four settings:
    // config/settings_visual.cfg NAMES all of them, and st_LoadConfig loads
    // config/settings.cfg (which includes it) AFTER user.cfg -- so a default in
    // eCamera.cpp is overwritten on every boot by the shipped config, and so is
    // anything a player could put in user.cfg. They are also tSettingItem, i.e.
    // never written back to user.cfg, and there is no menu row for any of them.
    // The player therefore has NO way to set these today, on any platform,
    // which is exactly the "there is no player choice for it to overwrite" case
    // web/webdefaults/autoexec.cfg's own header calls harmless.
    //
    // WHY IT IS TOUCH-ONLY AND WHY THAT IS THE POINT. The dispatch's constraint
    // is "do not break the desktop experience to fix the phone one". Appending
    // to the preloaded autoexec.cfg from the page -- rather than editing
    // web/webdefaults/autoexec.cfg on disk -- is what makes the change
    // conditional on something only the page knows: whether the primary input
    // is a finger. A desktop visitor's /data/webdefaults/autoexec.cfg is byte
    // for byte the file the build shipped, and every desktop gate in
    // web/tools/ therefore measures an unchanged game.
    //
    // ?cam=F OVERRIDES IT, ON ANY DEVICE, and that is how the next round of
    // this conversation gets to be a measurement instead of a preference.
    // ?cam=1 is stock (nothing is written at all), ?cam=0.35 is closer still.
    //
    // THE FOUR BASE VALUES ARE COPIED FROM config/settings_visual.cfg and are
    // multiplied, not replaced, so the speed-scaling shape of the stock camera
    // is preserved: at 40 m/s the halved camera sits where the stock one sits
    // at 14 m/s rather than on top of the cycle. If those base values ever
    // change in that file, THESE GO STALE SILENTLY -- there is no way for a
    // page to read them back, since they are not exposed to JS anywhere.
    const CAMERA_BASE = {                      // config/settings_visual.cfg
      CAMERA_CUSTOM_BACK: 6,   CAMERA_CUSTOM_RISE: 4,
      CAMERA_CUSTOM_BACK_FROMSPEED: 0.5, CAMERA_CUSTOM_RISE_FROMSPEED: 0.4,
      CAMERA_GLANCE_BACK: 6,   CAMERA_GLANCE_RISE: 4,
      CAMERA_GLANCE_BACK_FROMSPEED: 0.5, CAMERA_GLANCE_RISE_FROMSPEED: 0.4
    };
    const CAMERA_TOUCH_FACTOR = 0.5;
    function applyTouchCameraTuning() {
      let factor = 1;
      try {
        const q = readNumberParam('cam', 0.15, 4);
        factor = q !== null ? q : (window.AA_TOUCH ? CAMERA_TOUCH_FACTOR : 1);
        if (factor === 1) {
          console.log('[CAMERA] stock camera (factor 1' +
                      (q !== null ? ', from ?cam' : '') + ')');
          return;
        }
        const lines = ['', '# appended at runtime by web/shell.html: camera x' +
                       factor + (window.AA_TOUCH ? ' (touch device)' : '')];
        for (const k in CAMERA_BASE) {
          lines.push(k + ' ' + (Math.round(CAMERA_BASE[k] * factor * 1e4) / 1e4));
        }
        lines.push('');
        const path = '/data/webdefaults/autoexec.cfg';
        Module.FS.writeFile(
          path, Module.FS.readFile(path, { encoding: 'utf8' }) + lines.join('\n'));
        console.log('[CAMERA] camera distance x' + factor +
                    ' written to ' + path + ' before main()');
      } catch (e) {
        // A failure here is a stock camera, not a broken game. It must never
        // reach showFailure.
        console.log('[CAMERA] tuning skipped (factor ' + factor + '): ' + e);
      }
    }

    // ---- M6: NO CRASH SPARKS ON A TOUCH DEVICE ---------------------------
    //
    // THE MEASUREMENT FIRST, AND IT IS ABOUT THE WALL. M6 task 3's grind arm
    // holds a cycle pressed against the rim for the whole measured window --
    // which is not a contrived case on a phone, it is what a thumb does by
    // accident every round. Stock, that frame costs 17.15 ms median and 20.3 ms
    // in the worst measured second, and the draw count BURSTS to 171 calls in
    // a frame. Re-run with SPARKS 0, twice: 13.1 and 13.65 ms median, worst 13.8
    // and 15.0, and the draw count pinned flat at 60. About a quarter of the
    // frame at the wall is spark bursts, and it is spent exactly when the
    // player is least able to afford it.
    //
    // READ THE 17.15 WITH ITS CONDITION. It is the arm whose cycle sparked in
    // 29 of its 40 rim seconds. The SECOND stock run of the same arm sparked
    // in only 11 of 40 and read 14.0 ms median (worst 18.3), so the median win
    // is 23.6 % in the first and 2.5 % in the second, while the WORST second
    // falls 32 % and 18 %. The quarter is what a cycle that is actually
    // sparking gets back, not what every rim second costs.
    // docs/evidence/m6-lag/task8-sparks/.
    //
    // WHAT IS TURNED OFF, EXACTLY. SPARKS is an existing config item --
    // `static tConfItem<bool> cs2("SPARKS",crash_sparks)` in src/tron/gMenus.cpp
    // -- and the flag is read at the two `if (crash_sparks && animts>0)` guards
    // in src/tron/gCycle.cpp (the four `new gSpark` calls live inside them),
    // both in the WALL-CONTACT block: this is the shower a cycle throws while
    // it grinds a wall, and nothing else. Dying is EXPLOSION, below, which is a
    // different flag over a different effect and is not touched. It is drawing
    // and nothing else: no physics, no timing, no rubber, no score consults it.
    // The game plays identically; it stops painting sparks. That is also why
    // this is a settings change and not a C++ one -- there is nothing to patch.
    //
    // EXPLOSION EXISTS TOO AND IS DELIBERATELY LEFT ALONE. It is the same kind
    // of switch over the same kind of effect, and it was NOT measured. Turning
    // a second thing off on the strength of the first one's number is precisely
    // the guess this milestone exists to stop making; if the explosion is worth
    // a quarter of a frame somewhere, that is another arm, with its own runs.
    //
    // WHY TOUCH-ONLY, AND WHY THE APPEND RATHER THAN THE SHIPPED FILE. Same
    // reason as the camera above: the maintainer's constraint is "do not change
    // the desktop experience to fix the phone one", and the desktop is not the
    // machine that is short of milliseconds. Appending to the preloaded
    // autoexec.cfg from the page -- rather than editing
    // web/webdefaults/autoexec.cfg on disk -- is what makes the change
    // conditional on something only the page knows: whether the primary input
    // is a finger. A desktop visitor's /data/webdefaults/autoexec.cfg stays
    // byte for byte the file the build shipped, and web/tools/menu-gate.steps
    // reads it back and asserts the word SPARKS does not appear in it.
    //
    // ?sparks=0 / ?sparks=1 OVERRIDE IT, ON ANY DEVICE, AND BOTH DIRECTIONS
    // WRITE. ?sparks=0 appends SPARKS 0 on a desktop, which is how the numbers
    // above were measured here at all -- the rig has no phone. ?sparks=1
    // appends SPARKS 1, and why it cannot simply stay quiet is the whole point
    // of the next paragraph.
    //
    // WHY SILENCE IS NOT AN OVERRIDE: SPARKS PERSISTS, AND THE CAMERA DOES NOT.
    // This first shipped with "?sparks=1 writes nothing, the device default is
    // simply skipped", and the maintainer found it on his phone: the sparks did
    // not come back. SPARKS is a tConfItem, and tConfItemBase::Save() returns
    // true (src/tools/tConfiguration.h:296), so st_SaveConfig() WRITES IT INTO
    // /persist/var/user.cfg -- and this page saves on every menu leave, 21
    // times in one gate run. So after the FIRST session with this append in
    // effect, the player's own saved config holds SPARKS 0. st_LoadConfig
    // (src/tools/tConfiguration.cpp:959) then reads user.cfg FIRST (line 975)
    // and the userconfigdir autoexec.cfg near the END (line 992), so the file
    // this page appends to always wins -- which is exactly why a silent
    // ?sparks=1 lost: it left the persisted 0 standing and appended nothing to
    // beat it. An override against a saved setting has to write.
    //
    // THE CAMERA NEVER HAD THIS PROBLEM, and the difference is one word in the
    // type: the CAMERA_* items are tSettingItems, whose Save() returns FALSE
    // (tConfiguration.h:497), so they never reach user.cfg at all and ?cam=1's
    // silence really is stock. Do not read the two functions as the same shape.
    //
    // AND THE PRICE OF THAT ORDERING, STATED PLAINLY: on a touch device the
    // append re-applies on EVERY boot, so a player who turns the sparks back on
    // in the in-game Preferences menu is overridden the next time the page
    // loads -- the menu writes user.cfg, and user.cfg is read before this file.
    // ?sparks=1 is the way back, and it is a URL rather than a setting because
    // a URL is the only thing here that outranks a file loaded after user.cfg.
    const SPARKS_OFF_LINE = 'SPARKS 0';
    const SPARKS_ON_LINE  = 'SPARKS 1';
    function applyTouchSparksTuning() {
      let value = null;   // null = write nothing at all
      try {
        // 0 = off, 1 = on, and BOTH are written -- see the paragraph above for
        // why 1 cannot be silence. SPARKS is a bool, so anything else is a typo
        // and is ignored out loud rather than silently half-answering the
        // question. WHICH TAG SAYS SO DEPENDS ON THE VALUE, because
        // readNumberParam screens the range first: ?sparks=2 is out of range,
