# Web-client defaults, preloaded into /data/webdefaults and pointed to by
# Module.arguments' --userconfigdir (web/shell.html) and web/Makefile's
# `--preload-file web/webdefaults@/data/webdefaults`.
#
# This is defence in depth, not the primary guard: the actual risk -- WebGL's
# GL_VENDOR string tripping rScreen.cpp's NVIDIA sniff and turning on
# INFINITY_PLANE / USE_DISPLAYLISTS -- was removed at the source in Task 5
# (the whole branch is now #ifndef __EMSCRIPTEN__). Do not describe this file
# as what keeps display lists off; that patch is.
#
# CAVEAT (found while wiring this up, not yet acted on): st_LoadConfig()
# (src/tools/tConfiguration.cpp) only ever opens files by these exact fixed
# names -- user.cfg, settings.cfg, settings_dedicated.cfg (dedicated only),
# default.cfg (client, first use only), moviepack/settings.cfg, autoexec.cfg.
# "settings_web.cfg" is not one of them, and the client build has no
# equivalent of the dedicated server's --extraconfig flag to name an extra
# file explicitly. So as shipped, nothing in the current source ever opens
# this file by this name -- it is inert, not merely "defence in depth". It
# is still written here, under its briefed name and path, because the values
# below are the ones this game should run with in a browser regardless of
# whether this particular delivery mechanism is later wired up (e.g. by
# renaming to default.cfg, or by adding an INCLUDE line -- both out of scope
# for this task, which touches no game source). Flagged for Task 7 / review.
MAX_FPS 60
INFINITY_PLANE 0
USE_DISPLAYLISTS 0
SOUND_BUFFER_SHIFT 3
