# THE STEERING-DIFFERENTIAL SERVER. Mounted into the aa-dedicated container as
# its VAR directory, which is the last thing tConfiguration.cpp's st_LoadConfig
# reads (src/tools/tConfiguration.cpp:993, after settings_dedicated.cfg and
# after config/autoexec.cfg), so every line here is a hard override.
#
#   docker run -d --name aa-server -p 4534:4534/udp \
#     -v "$PWD/bridge/test-server/steer-var:/steervar" aa-dedicated \
#     /opt/aa/bin/armagetronad-dedicated --userdatadir /data --vardir /steervar
#
# WHY IT EXISTS. web/tools/bridge-gate.steps proves a browser player joins,
# plays and dies, all from the server's log -- but nothing in this tree logs
# per-turn state, so none of it proves a STEERING KEYPRESS reached the server.
# This config turns the server itself into the instrument for that one claim.

# -- 1. THE CLOCK. LADDERLOG_GAME_TIME_INTERVAL makes gGame::GameLoop write
# `[L] GAME_TIME <t>` every quarter second (src/tron/gGame.cpp:4340), where t
# is se_GameTime() -- the SERVER'S OWN simulation clock, reset each round.
# CONSOLE_LADDER_LOG puts it on stdout, where `docker logs` can read it
# (src/engine/ePlayer.cpp:6181). Together they timestamp the server's own
# `[L] DEATH_SUICIDE` / `[L] DEATH_FRAG` lines to 0.25 s, on the server's
# clock. Nothing about that reading passes through the browser.
CONSOLE_LADDER_LOG 1
LADDERLOG_GAME_TIME_INTERVAL 0.25

# -- 2. NO AI, SO THE ARENA HOLDS EXACTLY ONE CYCLE. This is what makes the
# measurement mean anything. With the shipped config three AIs join (measured:
# docs/evidence/m-a-bridge/b2/server.log has LaTeX, Gcc and Gdb entering), and
# then a round's length is about when the AIs finish and an AI's wall can cut
# across a straight path -- so neither the round's duration nor the death's
# cause says anything about the browser player. Empty the arena and the only
# things in it are the rim and the browser player's own wall.
# TEAM_BALANCE_WITH_AIS 0 is the documented off switch (config/settings_dedicated.cfg:305).
TEAM_BALANCE_WITH_AIS 0
MIN_PLAYERS 1
NUM_AIS 0
AUTO_AIS 0
AUTO_IQ 0
SP_MIN_PLAYERS 1
SP_NUM_AIS 0

# -- 3. THE ROUND ENDS WHEN THE SOLE PLAYER DIES. GAME_TYPE 0 is freestyle:
# "round only ends when everyone is dead" (settings_dedicated.cfg:315). With
# one cycle that is exactly "the round ends when web_user dies", so the
# server's own per-round `Time: N seconds` line becomes a second, independent
# reading of the same survival.
GAME_TYPE 0
FINISH_TYPE 0
SIZE_FACTOR 0

# -- 4. NOTHING MAY END A ROUND EXCEPT THE DEATH. The instant win zone
# appears after WIN_ZONE_MIN_ROUND_TIME and shrinks onto the survivors; a
# browser player who steered well enough to outlast the rim could then be
# handed a round win, which would truncate the very interval being measured.
# Pushed out of reach rather than left at 60/30.
WIN_ZONE_MIN_ROUND_TIME 100000
WIN_ZONE_MIN_LAST_DEATH 100000

# -- 5. NO MATCH CHURN. Ten rounds per match is the default and a new match
# reshuffles spawn points; a single long match keeps both arms on the same
# per-round spawn sequence, which is what lets the control's spread stand as
# the bound for the steering arm.
LIMIT_ROUNDS 200
LIMIT_SCORE 1000000
