# Login gate (web/tools/run-login-gate.sh). Waits for a second player (so the
# client stays connected), allows Global ID logins, and trusts the local
# network: the test client connects to 127.0.0.1 while the server binds every
# address, which the anti-pharming check would otherwise refuse.
MIN_PLAYERS 2
NUM_AIS 0
AUTO_AIS 0
TEAM_BALANCE_WITH_AIS 0
GLOBAL_ID 1
TRUST_LAN 1
