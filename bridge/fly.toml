# Fly.io deployment of the relay. See README.md, "Deploying to Fly".
#
# ONE machine, NEVER auto-stopped. The client probes for the bridge with a
# 1500 ms budget before it lets the player into the network menu (sg_menuProbeMs
# in src/emscripten/eWebNet.cpp); a cold start would blow through that and the
# page would report "no bridge" seconds before there was one.
app = "armagetronad-bridge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# OPEN TO THE PUBLISHED PAGE (M-C). A browser on these pages may connect with
# no token; the BRIDGE_TOKEN secret, if set, still works from anywhere. Fly's
# proxy puts the player's real address in Fly-Client-IP and overwrites any
# value a client sent, which is what makes the per-IP limit per player
# instead of one limit shared by everyone. See limits.mjs for the limits.
[env]
  BRIDGE_ORIGINS = "https://escapedcat.github.io"
  BRIDGE_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Fly's cap sits BELOW the relay's own total (200, limits.mjs), so on this
  # machine it is the one that bites; the relay's is the backstop elsewhere.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
